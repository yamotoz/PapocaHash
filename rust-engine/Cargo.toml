[package]
name = "papocahash-engine"
version = "1.0.0"
edition = "2021"

[dependencies]
md-5 = "=0.10.6"
sha2 = "=0.10.9"
bcrypt = "=0.17.0"
argon2 = "=0.5.3"
rayon = "=1.12.0"
memmap2 = "=0.9.9"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
