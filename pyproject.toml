[project]
name = "papocahash"
version = "1.0.0"
description = "Laboratório local de desempenho de buscas por hash"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "psutil==7.2.2",
  "bcrypt==5.0.0", "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full: buscas integrais na lista de um milhão"]
